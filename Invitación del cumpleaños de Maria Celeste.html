<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitación Princesa María Celeste</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script:wght@600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --lila1: #e0c3fc;
  --lila2: #c084fc;
  --lila3: #9333ea;
  --lila4: #7e22ce;
  --pink1: #fce4f5;
  --pink2: #f0abf0;
  --gold: #ffd700;
  --white: #fff;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #c084fc 0%, #a855f7 40%, #7c3aed 100%);
  font-family: 'Nunito', sans-serif;
  overflow: hidden;
  position: relative;
}

/* ========== INTRO SCREEN ========== */
#intro {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #f0d0ff 0%, #c084fc 50%, #7c3aed 100%);
  animation: introBg 0.5s ease;
}

@keyframes introBg {
  from { opacity: 0; }
  to { opacity: 1; }
}

.intro-crown {
  font-size: 80px;
  animation: crownDrop 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.2s both,
             crownSpin 1s ease 0.2s both;
}

@keyframes crownDrop {
  from { opacity: 0; transform: translateY(-120px) scale(0.3); }
  to   { opacity: 1; transform: translateY(0px) scale(1); }
}

@keyframes crownSpin {
  from { filter: drop-shadow(0 0 0px gold); }
  to   { filter: drop-shadow(0 0 30px gold) drop-shadow(0 0 60px #ff88ff); }
}

.intro-title {
  font-family: 'Pacifico', cursive;
  font-size: 32px;
  color: #fff;
  text-shadow: 0 0 20px rgba(255,200,255,0.9), 2px 2px 0 #9333ea;
  margin: 16px 0 8px;
  opacity: 0;
  animation: fadeUp 0.6s ease 0.8s forwards;
  text-align: center;
  padding: 0 20px;
}

.intro-sub {
  font-family: 'Dancing Script', cursive;
  font-size: 20px;
  color: #f0d0ff;
  opacity: 0;
  animation: fadeUp 0.6s ease 1.1s forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.intro-btn {
  margin-top: 28px;
  padding: 14px 36px;
  font-family: 'Pacifico', cursive;
  font-size: 18px;
  color: var(--lila4);
  background: linear-gradient(135deg, #fff 0%, #fce4ff 100%);
  border: none;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 8px 30px rgba(100,0,180,0.4), 0 0 0 3px rgba(255,255,255,0.4);
  opacity: 0;
  animation: fadeUp 0.6s ease 1.4s forwards;
  transition: transform 0.2s, box-shadow 0.2s;
}

.intro-btn:hover {
  transform: scale(1.07) translateY(-2px);
  box-shadow: 0 12px 40px rgba(100,0,180,0.5), 0 0 0 4px rgba(255,255,255,0.6);
}

.intro-stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.istar {
  position: absolute;
  font-size: 22px;
  opacity: 0;
  animation: starFloat var(--dur) ease-in-out var(--delay) infinite;
}

@keyframes starFloat {
  0%   { opacity: 0; transform: translateY(20px) rotate(0deg) scale(0.5); }
  20%  { opacity: 1; }
  80%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(-80px) rotate(360deg) scale(1.3); }
}

/* ========== MAIN CARD ========== */
#main {
  display: none;
  width: 100%;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
}

/* Floating background particles */
.bg-particle {
  position: fixed;
  pointer-events: none;
  font-size: var(--sz);
  opacity: 0;
  animation: bgFloat var(--dur) ease-in-out var(--del) infinite;
  z-index: 0;
}

@keyframes bgFloat {
  0%   { opacity: 0; transform: translateY(100vh) rotate(0deg); }
  15%  { opacity: 0.7; }
  85%  { opacity: 0.7; }
  100% { opacity: 0; transform: translateY(-10vh) rotate(720deg); }
}

.card {
  width: 360px;
  background: linear-gradient(180deg, #fce4f8 0%, #f3c8f8 35%, #e8aaef 65%, #fce4f8 100%);
  border-radius: 24px;
  position: relative;
  overflow: hidden;
  z-index: 10;
  box-shadow:
    0 30px 80px rgba(120, 0, 200, 0.45),
    0 0 0 4px #c084fc,
    0 0 0 8px #fff,
    0 0 0 12px #c084fc;
  animation: cardReveal 0.9s cubic-bezier(0.34,1.4,0.64,1) 0.1s both;
}

@keyframes cardReveal {
  from { opacity: 0; transform: scale(0.5) rotate(-8deg); }
  to   { opacity: 1; transform: scale(1) rotate(0deg); }
}

/* Side stripes */
.card::before, .card::after {
  content: '';
  position: absolute;
  top: 0;
  width: 26px; height: 100%;
  background: repeating-linear-gradient(180deg,
    #a855f7 0px, #a855f7 16px,
    #7c3aed 16px, #7c3aed 32px);
  z-index: 1;
}
.card::before { left: 0; }
.card::after  { right: 0; }

.inner {
  margin: 0 26px;
  padding: 16px 14px 20px;
  position: relative;
  z-index: 2;
}

/* Sparkle bg inside card */
.sparkle-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.sp {
  position: absolute;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(200, 120, 230, 0.35);
  animation: sparkPulse var(--sd) ease-in-out var(--ss) infinite;
}

@keyframes sparkPulse {
  0%, 100% { transform: scale(0); opacity: 0; }
  50%       { transform: scale(1.8); opacity: 0.8; }
}

/* Header text */
.header-text {
  text-align: center;
  font-family: 'Dancing Script', cursive;
  font-size: 15.5px;
  color: #7c3aed;
  line-height: 1.45;
  margin-bottom: 2px;
  animation: slideDown 0.6s ease 0.5s both;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Princess area */
.princess-area {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin: 4px 0 2px;
  position: relative;
  animation: slideDown 0.7s ease 0.7s both;
}

.princess-emoji {
  font-size: 78px;
  line-height: 1;
  filter: drop-shadow(0 6px 14px rgba(130, 0, 200, 0.35));
  animation: princessFloat 3.5s ease-in-out infinite;
  position: relative;
  z-index: 2;
}

@keyframes princessFloat {
  0%, 100% { transform: translateY(0px) scale(1); }
  50%       { transform: translateY(-10px) scale(1.04); }
}

.aura {
  position: absolute;
  width: 90px; height: 90px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200,120,255,0.3) 0%, transparent 70%);
  animation: auraPulse 2.5s ease-in-out infinite;
  z-index: 1;
}

@keyframes auraPulse {
  0%, 100% { transform: scale(0.9); opacity: 0.5; }
  50%       { transform: scale(1.4); opacity: 0.9; }
}

.side-char {
  font-size: 30px;
  animation: sideFloat 2.8s ease-in-out infinite;
}
.side-char.left  { animation-delay: 0.2s; }
.side-char.right { animation-delay: 0.7s; }

@keyframes sideFloat {
  0%, 100% { transform: translateY(0) rotate(-6deg) scale(1); }
  50%       { transform: translateY(-8px) rotate(6deg) scale(1.1); }
}

/* Title banner */
.title-banner {
  background: linear-gradient(90deg, #7c3aed, #a855f7, #c084fc, #a855f7, #7c3aed);
  background-size: 300% 100%;
  animation: bannerShimmer 3s ease infinite, bannerDrop 0.7s ease 1s both;
  border-radius: 50px;
  padding: 9px 18px;
  text-align: center;
  margin: 8px 0 6px;
  box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5), inset 0 1px 0 rgba(255,255,255,0.25);
}

@keyframes bannerShimmer {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes bannerDrop {
  from { opacity: 0; transform: scaleX(0.3); }
  to   { opacity: 1; transform: scaleX(1); }
}

.title-banner h1 {
  font-family: 'Pacifico', cursive;
  font-size: 24px;
  color: #fff;
  text-shadow: 2px 2px 0 rgba(80,0,160,0.5), 0 0 20px rgba(255,200,255,0.8);
  line-height: 1.3;
}

/* Divider */
.divider {
  text-align: center;
  font-size: 17px;
  margin: 5px 0;
  letter-spacing: 5px;
  animation: dividerPop 0.5s ease var(--divDel) both;
}

@keyframes dividerPop {
  from { opacity: 0; transform: scale(0.5); }
  to   { opacity: 1; transform: scale(1); }
}

/* Info rows */
.info-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(4px);
  border-radius: 14px;
  padding: 8px 12px;
  margin: 5px 0;
  border: 1.5px dashed #c084fc;
  animation: rowSlide 0.5s ease var(--rowDel) both;
  box-shadow: 0 2px 10px rgba(160,80,220,0.12);
}

@keyframes rowSlide {
  from { opacity: 0; transform: translateX(-30px); }
  to   { opacity: 1; transform: translateX(0); }
}

.info-icon { font-size: 20px; }

.info-text {
  font-size: 13.5px;
  color: #6b21a8;
  font-weight: 800;
  text-align: center;
  line-height: 1.4;
}

/* Bottom row */
.bottom-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
  animation: rowSlide 0.5s ease 2s both;
}

.bottom-char { font-size: 28px; }

.invite-box {
  background: linear-gradient(135deg, #a855f7, #c084fc);
  border-radius: 16px;
  padding: 9px 16px;
  text-align: center;
  border: 2px solid #fff;
  flex: 1;
  box-shadow: 0 4px 20px rgba(120,40,220,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
  animation: invitePulse 2s ease-in-out 2.5s infinite;
}

@keyframes invitePulse {
  0%, 100% { box-shadow: 0 4px 20px rgba(120,40,220,0.4), inset 0 1px 0 rgba(255,255,255,0.3); }
  50%       { box-shadow: 0 4px 35px rgba(120,40,220,0.7), inset 0 1px 0 rgba(255,255,255,0.3); }
}

.invite-box p {
  font-family: 'Dancing Script', cursive;
  font-size: 19px;
  color: #fff;
  font-weight: 700;
  text-shadow: 1px 1px 4px rgba(60,0,120,0.4);
  line-height: 1.4;
}

/* Confetti burst on load */
.confetti-piece {
  position: fixed;
  width: 10px; height: 10px;
  border-radius: 2px;
  pointer-events: none;
  z-index: 100;
  opacity: 0;
  animation: confettiFall var(--cf-dur) ease var(--cf-del) forwards;
}

@keyframes confettiFall {
  0%   { opacity: 1; top: -10px; transform: translateX(0) rotate(0deg); }
  100% { opacity: 0; top: 110vh; transform: translateX(var(--cf-x)) rotate(720deg); }
}

/* ========== GLITTER STARS ON CARD ========== */
.glitter {
  position: absolute;
  pointer-events: none;
  z-index: 5;
  font-size: 16px;
  animation: glitterTwinkle var(--gd) ease-in-out var(--gdel) infinite;
}

@keyframes glitterTwinkle {
  0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
  50%       { opacity: 1; transform: scale(1.2) rotate(180deg); }
}
</style>
</head>
<body>

<!-- ===== INTRO SCREEN ===== -->
<div id="intro">
  <div class="intro-stars" id="introStars"></div>
  <div class="intro-crown">👑</div>
  <div class="intro-title">¡Una Princesa<br>Cumple 6 Años! 🎀</div>
  <div class="intro-sub">✨ Tienes una invitación especial ✨</div>
  <button class="intro-btn" onclick="openInvitation()">
    🌟 Abrir Invitación 🌟
  </button>
</div>

<!-- ===== MAIN INVITATION ===== -->
<div id="main">

  <!-- Background floating particles -->
  <div id="bgParticles"></div>

  <div class="card" id="card">
    <!-- Sparkle bg -->
    <div class="sparkle-bg" id="sparkleBg"></div>

    <!-- Glitters on card -->
    <span class="glitter" style="top:5%;left:35%;--gd:1.8s;--gdel:0s">✦</span>
    <span class="glitter" style="top:12%;right:8%;--gd:2.2s;--gdel:0.4s">⭐</span>
    <span class="glitter" style="top:50%;left:5%;--gd:1.6s;--gdel:0.8s">✨</span>
    <span class="glitter" style="top:70%;right:6%;--gd:2s;--gdel:1.2s">✦</span>
    <span class="glitter" style="bottom:8%;left:38%;--gd:1.9s;--gdel:0.6s">⭐</span>

    <div class="inner">

      <!-- Header -->
      <div class="header-text">
        Soy <strong>María Celeste</strong><br>
        y te invito a celebrar
      </div>

      <!-- Princess -->
      <div class="princess-area">
        <span class="side-char left">🦋</span>
        <div style="position:relative;display:flex;align-items:center;justify-content:center;">
          <div class="aura"></div>
          <span class="princess-emoji">👸</span>
        </div>
        <span class="side-char right">🌸</span>
      </div>

      <!-- Title -->
      <div class="title-banner">
        <h1>¡Mis 6 Añitos! 🎀</h1>
      </div>

      <div class="divider" style="--divDel:1.2s">🌸 🌺 🌸</div>

      <!-- Date -->
      <div class="info-row" style="--rowDel:1.4s">
        <span class="info-icon">📅</span>
        <span class="info-text">Domingo <strong>07 de Junio</strong></span>
      </div>

      <!-- Address -->
      <div class="info-row" style="--rowDel:1.6s">
        <span class="info-icon">📍</span>
        <span class="info-text">
          Cra 95a #129b-23<br>
          Suba Rincón
        </span>
      </div>

      <div class="divider" style="--divDel:1.8s">🌸 🌺 🌸</div>

      <!-- Bottom -->
      <div class="bottom-row">
        <span class="bottom-char">🐿️</span>
        <div class="invite-box">
          <p>¡Te Espero,<br>No Faltes! 🎉</p>
        </div>
        <span class="bottom-char">🦢</span>
      </div>

    </div>
  </div>
</div>

<!-- Confetti container -->
<div id="confettiContainer"></div>

<script>
// ===== INTRO FLOATING STARS =====
const introStars = document.getElementById('introStars');
const starEmojis = ['⭐','🌟','✨','💫','🌸','🦋','💜','🎀','👑'];
for (let i = 0; i < 22; i++) {
  const s = document.createElement('span');
  s.className = 'istar';
  s.textContent = starEmojis[Math.floor(Math.random() * starEmojis.length)];
  s.style.cssText = `
    left: ${Math.random() * 100}%;
    top: ${Math.random() * 100}%;
    --dur: ${2 + Math.random() * 3}s;
    --delay: ${Math.random() * 3}s;
    font-size: ${14 + Math.random() * 18}px;
  `;
  introStars.appendChild(s);
}

// ===== OPEN INVITATION =====
function openInvitation() {
  const intro = document.getElementById('intro');
  intro.style.transition = 'all 0.8s cubic-bezier(0.4,0,0.2,1)';
  intro.style.transform = 'scale(3)';
  intro.style.opacity = '0';

  setTimeout(() => {
    intro.style.display = 'none';
    const main = document.getElementById('main');
    main.style.display = 'flex';
    launchConfetti();
    buildBgParticles();
    buildSparkles();
  }, 700);
}

// ===== CONFETTI BURST =====
function launchConfetti() {
  const colors = ['#c084fc','#a855f7','#f0abf0','#ffd700','#ff88cc','#fff','#e879f9','#818cf8'];
  const container = document.getElementById('confettiContainer');
  for (let i = 0; i < 80; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const color = colors[Math.floor(Math.random() * colors.length)];
    const xDrift = (Math.random() - 0.5) * 400;
    const dur = 1.5 + Math.random() * 2;
    const del = Math.random() * 1;
    p.style.cssText = `
      left: ${Math.random() * 100}%;
      background: ${color};
      --cf-x: ${xDrift}px;
      --cf-dur: ${dur}s;
      --cf-del: ${del}s;
      width: ${6 + Math.random() * 10}px;
      height: ${6 + Math.random() * 10}px;
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
    `;
    container.appendChild(p);
  }
  // Repeat confetti wave at 1.5s
  setTimeout(launchConfetti2, 1500);
}

function launchConfetti2() {
  const colors = ['#ffd700','#fff','#ff88cc','#c084fc','#e879f9'];
  const container = document.getElementById('confettiContainer');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const color = colors[Math.floor(Math.random() * colors.length)];
    const xDrift = (Math.random() - 0.5) * 300;
    const dur = 1.8 + Math.random() * 1.5;
    p.style.cssText = `
      left: ${10 + Math.random() * 80}%;
      background: ${color};
      --cf-x: ${xDrift}px;
      --cf-dur: ${dur}s;
      --cf-del: 0s;
      width: ${5 + Math.random() * 8}px;
      height: ${5 + Math.random() * 8}px;
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
    `;
    container.appendChild(p);
  }
}

// ===== BACKGROUND FLOATING PARTICLES =====
function buildBgParticles() {
  const emojis = ['🌸','🦋','✨','💫','⭐','🌟','💜','🎀','🌺','🌷'];
  const container = document.getElementById('bgParticles');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'bg-particle';
    const em = emojis[Math.floor(Math.random() * emojis.length)];
    p.textContent = em;
    p.style.cssText = `
      left: ${Math.random() * 100}%;
      --sz: ${16 + Math.random() * 20}px;
      --dur: ${4 + Math.random() * 5}s;
      --del: ${Math.random() * 5}s;
    `;
    container.appendChild(p);
  }
}

// ===== SPARKLE DOTS INSIDE CARD =====
function buildSparkles() {
  const bg = document.getElementById('sparkleBg');
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('div');
    s.className = 'sp';
    s.style.cssText = `
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      --sd: ${1.5 + Math.random() * 2}s;
      --ss: ${Math.random() * 2}s;
      background: ${Math.random() > 0.5 ? 'rgba(200,120,240,0.4)' : 'rgba(255,200,255,0.5)'};
    `;
    bg.appendChild(s);
  }
}
</script>
</body>
</html>
